name: publish-mcp-registry
# Publishes server.json (io.github.walkley/cn-calendar) to the official MCP Registry.
# Manual only: run it from the Actions tab after the stack with POST /mcp is deployed, since the Registry lists the
# remote URL as given. Never runs on push or pull_request.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the Registry; grants the io.github.walkley/* namespace
    env:
      # Pinned; upgrade deliberately (the archive is checked against its Sigstore bundle below).
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: this job holds id-token: write
        with:
          persist-credentials: false

      - name: Check that the remote answers MCP initialize
        run: |
          set -euo pipefail
          url="$(jq -r '.remotes[0].url' server.json)"
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"publish-check","version":"1"}}}'
          curl --fail --silent --show-error --max-time 30 -H 'content-type: application/json' -d "$body" "$url" | jq -e '.result.serverInfo.name == "cn-calendar"'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
